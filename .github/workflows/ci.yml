name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build-test (CppAD=${{ matrix.cppad }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Build and test both configurations: the full CppAD build and the
        # pure (YABI_USE_CPPAD=OFF) build.  The pure configuration also runs
        # the CppAD-free component unit tests.
        cppad: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            liblapack-dev libblas-dev libcppad-dev

      - name: Configure
        run: cmake -S . -B build -DYABI_USE_CPPAD=${{ matrix.cppad }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

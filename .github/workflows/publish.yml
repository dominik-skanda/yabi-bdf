name: Build wheels and publish

# Builds manylinux wheels (CPython 3.10–3.14) + the sdist and publishes them to
# PyPI.  The wheels are built inside a manylinux container (so the glibc symbol
# floor is old enough for PyPI's `manylinux_*` tags) and `auditwheel repair`-ed
# by cibuildwheel to bundle the BLAS/LAPACK runtime.
#
# Release flow: bump `version` in pyproject.toml, tag `v<version>`, push the tag
# (or run this workflow manually via `workflow_dispatch`).
#
# Required secret (GitHub → Settings → Secrets and variables → Actions):
#   YABI_TOKEN — a PyPI API token (username __token__, scope "entire account").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (manylinux)
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*musllinux*"
          # Only 64-bit x86_64 (the default also builds 32-bit i686, which has no
          # OpenBLAS and is not needed).
          CIBW_ARCHS_LINUX: "x86_64"
          # Surface the CMake error on failure (default verbosity hides it).
          CIBW_BUILD_VERBOSITY: "2"
          # Pin the manylinux image: manylinux2014 (CentOS 7) is EOL and its yum
          # repos are dead, so use manylinux_2_28 (AlmaLinux 8) for every Python.
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          # The C++ core links BLAS/LAPACK (OpenBLAS) + gfortran; install them in
          # the manylinux image so the wheel bundles them at repair time.
          CIBW_BEFORE_ALL_LINUX: "yum install -y openblas-devel gcc-gfortran"
          # openblas-devel provides a single libopenblas.so (BLAS+LAPACK), so
          # tell CMake to use OpenBLAS for both (otherwise find_package(LAPACK)
          # looks for a separate liblapack.so and fails).
          CIBW_ENVIRONMENT: 'CMAKE_ARGS="-DBLA_VENDOR=OpenBLAS"'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          cp dist/*.tar.gz wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: wheelhouse/*

  build_cuda:
    name: Build CUDA wheels (+cu130)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One package (torch-style): the CUDA build is published as a local version
      # `yabi-torch==<version>+cu130` of the SAME `yabi-torch` package, so a plain
      # `pip install yabi-torch` picks it up.  This is safe on CPU-only machines
      # because the CUDA runtime libs load the driver lazily (verified: no hard
      # libcuda.so.1 NEEDED on cusolver/cublas/cusparse/cudart/nvJitLink).
      - name: Tag the version as +cu130
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}+cu130\"/" pyproject.toml

      - name: Build CUDA wheels (manylinux)
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD_VERBOSITY: "2"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          # OpenBLAS/gfortran (as in the CPU build) plus the CUDA 13.0 host-side
          # runtime: cuSOLVER/cuBLAS/cuSPARSE/cudart + nvJitLink (a transitive dep
          # of cuBLAS).  The devel packages provide cusolverDn.h / cuda_runtime.h
          # for the build; auditwheel bundles the runtime .so files into the wheel.
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y openblas-devel gcc-gfortran &&
            printf '[cuda]\nname=cuda\nbaseurl=https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/cuda.repo &&
            yum install -y cuda-cudart-devel-13-0 libcusolver-devel-13-0
            libcublas-13-0 libcusparse-13-0 libnvjitlink-13-0
          CIBW_ENVIRONMENT: 'CMAKE_ARGS="-DBLA_VENDOR=OpenBLAS -DYABI_USE_CUDA=ON"'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-cuda
          path: wheelhouse/*

  publish:
    name: Publish to PyPI
    needs: [build, build_cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: dist-cuda
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.YABI_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --skip-existing dist/*

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release for ${{ github.ref_name }} already exists — skipping"
          else
            gh release create "${{ github.ref_name }}" \
              --title "yabi-torch ${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          fi
